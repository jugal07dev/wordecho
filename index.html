<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordEcho — Interactive Vocabulary & Thesaurus Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="waves" class="w-8 h-8 text-indigo-400"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">WordEcho</span>
            </div>
            <span class="text-xs text-slate-400 border border-slate-700 rounded-full px-3 py-1">v1.0</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">

        <!-- Search Form -->
        <form id="searchForm" class="mb-8">
            <div class="relative flex items-center">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search any word (e.g., happy, inspire)..." 
                    required 
                    autocomplete="off"
                    class="w-full bg-slate-800/90 border border-slate-700 text-white placeholder-slate-400 rounded-xl py-4 pl-5 pr-14 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg shadow-lg"
                >
                <button 
                    type="submit" 
                    id="searchBtn" 
                    class="absolute right-2 bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-lg transition-all"
                >
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>
        </form>

        <!-- Status Message -->
        <div id="statusMessage" class="hidden text-center py-6 text-slate-400 text-lg"></div>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden space-y-6">
            
            <!-- Word Header Card -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur">
                <div class="flex items-start justify-between flex-wrap gap-4">
                    <div>
                        <h1 id="wordTitle" class="text-4xl font-extrabold capitalize text-white mb-1"></h1>
                        <p id="phoneticText" class="text-indigo-400 text-lg font-mono"></p>
                    </div>
                    <button id="audioBtn" class="hidden flex items-center space-x-2 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-4 py-2 rounded-xl transition">
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                        <span>Listen</span>
                    </button>
                </div>
            </div>

            <!-- Definitions -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-indigo-400"></i>
                    <span>Definitions</span>
                </h2>
                <div id="definitionsList" class="space-y-4"></div>
            </div>

            <!-- Synonyms -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
                    <i data-lucide="copy" class="w-5 h-5 text-emerald-400"></i>
                    <span>Synonyms</span>
                </h2>
                <div id="synonymsList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Antonyms -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 backdrop-blur">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center space-x-2">
                    <i data-lucide="git-compare" class="w-5 h-5 text-rose-400"></i>
                    <span>Antonyms</span>
                </h2>
                <div id="antonymsList" class="flex flex-wrap gap-2"></div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>WordEcho — Project by Jugal Chettri (24SV0019) & Simran Rai (24SV0005)</p>
    </footer>

    <script>
        lucide.createIcons();

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const statusMessage = document.getElementById('statusMessage');
        const resultContainer = document.getElementById('resultContainer');
        const wordTitle = document.getElementById('wordTitle');
        const phoneticText = document.getElementById('phoneticText');
        const audioBtn = document.getElementById('audioBtn');
        const definitionsList = document.getElementById('definitionsList');
        const synonymsList = document.getElementById('synonymsList');
        const antonymsList = document.getElementById('antonymsList');

        let currentAudioUrl = '';

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim().toLowerCase();
            if (query) performSearch(query);
        });

        async function performSearch(word) {
            statusMessage.classList.remove('hidden');
            statusMessage.innerHTML = 'Searching dictionary...';
            resultContainer.classList.add('hidden');
            
            try {
                const [dictRes, synRes, antRes] = await Promise.all([
                    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`),
                    fetch(`https://api.datamuse.com/words?rel_syn=${encodeURIComponent(word)}`),
                    fetch(`https://api.datamuse.com/words?rel_ant=${encodeURIComponent(word)}`)
                ]);

                const dictData = dictRes.ok ? await dictRes.json() : null;
                const synData = synRes.ok ? await synRes.json() : [];
                const antData = antRes.ok ? await antRes.json() : [];

                if (!dictData && synData.length === 0 && antData.length === 0) {
                    statusMessage.innerHTML = `No results found for "<strong>${word}</strong>". Please try another word.`;
                    return;
                }

                displayResults(word, dictData ? dictData[0] : null, synData, antData);
                statusMessage.classList.add('hidden');
                resultContainer.classList.remove('hidden');

            } catch (err) {
                statusMessage.innerHTML = 'Error loading results. Please check your internet connection.';
                console.error(err);
            }
        }

        function displayResults(word, entry, syns, ants) {
            wordTitle.textContent = word;

            // Phonetics & Audio
            phoneticText.textContent = '';
            audioBtn.classList.add('hidden');
            currentAudioUrl = '';

            if (entry) {
                if (entry.phonetic) {
                    phoneticText.textContent = entry.phonetic;
                } else if (entry.phonetics && entry.phonetics.length) {
                    const p = entry.phonetics.find(item => item.text);
                    if (p) phoneticText.textContent = p.text;
                }

                if (entry.phonetics && entry.phonetics.length) {
                    const audioObj = entry.phonetics.find(item => item.audio && item.audio.length > 0);
                    if (audioObj) {
                        currentAudioUrl = audioObj.audio;
                        audioBtn.classList.remove('hidden');
                    }
                }
            }

            // Definitions
            definitionsList.innerHTML = '';
            if (entry && entry.meanings && entry.meanings.length) {
                entry.meanings.forEach(meaning => {
                    const pos = meaning.partOfSpeech;
                    meaning.definitions.slice(0, 2).forEach(def => {
                        const div = document.createElement('div');
                        div.className = 'bg-slate-900/50 p-3 rounded-lg border border-slate-700/40';
                        div.innerHTML = `<span class="text-xs font-semibold uppercase text-indigo-400 tracking-wider">${pos}</span>
                                         <p class="text-slate-200 mt-1">${def.definition}</p>`;
                        definitionsList.appendChild(div);
                    });
                });
            } else {
                definitionsList.innerHTML = '<p class="text-slate-400 text-sm">No definition available.</p>';
            }

            // Synonyms Pill List
            synonymsList.innerHTML = '';
            let allSynonyms = [];
            if (entry && entry.meanings) {
                entry.meanings.forEach(m => { if (m.synonyms) allSynonyms.push(...m.synonyms); });
            }
            if (syns && syns.length) {
                allSynonyms.push(...syns.map(item => item.word));
            }
            allSynonyms = [...new Set(allSynonyms)].slice(0, 12);

            if (allSynonyms.length) {
                allSynonyms.forEach(syn => {
                    const pill = document.createElement('button');
                    pill.className = 'px-3 py-1 bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 rounded-full text-sm hover:bg-emerald-500/20 transition';
                    pill.textContent = syn;
                    pill.onclick = () => { searchInput.value = syn; performSearch(syn); };
                    synonymsList.appendChild(pill);
                });
            } else {
                synonymsList.innerHTML = '<p class="text-slate-400 text-sm">No synonyms found.</p>';
            }

            // Antonyms Pill List
            antonymsList.innerHTML = '';
            let allAntonyms = [];
            if (entry && entry.meanings) {
                entry.meanings.forEach(m => { if (m.antonyms) allAntonyms.push(...m.antonyms); });
            }
            if (ants && ants.length) {
                allAntonyms.push(...ants.map(item => item.word));
            }
            allAntonyms = [...new Set(allAntonyms)].slice(0, 12);

            if (allAntonyms.length) {
                allAntonyms.forEach(ant => {
                    const pill = document.createElement('button');
                    pill.className = 'px-3 py-1 bg-rose-500/10 text-rose-300 border border-rose-500/30 rounded-full text-sm hover:bg-rose-500/20 transition';
                    pill.textContent = ant;
                    pill.onclick = () => { searchInput.value = ant; performSearch(ant); };
                    antonymsList.appendChild(pill);
                });
            } else {
                antonymsList.innerHTML = '<p class="text-slate-400 text-sm">No antonyms found.</p>';
            }
        }

        audioBtn.addEventListener('click', () => {
            if (currentAudioUrl) {
                const audio = new Audio(currentAudioUrl);
                audio.play();
            } else {
                const text = wordTitle.textContent;
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    window.speechSynthesis.speak(utterance);
                }
            }
        });
    </script>
</body>
</html>
